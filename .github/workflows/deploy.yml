name: Deploy to Server

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e

            # 创建部署目录
            mkdir -p /opt/fraudshield2026/server
            cd /opt/fraudshield2026

            # 克隆或更新代码
            if [ -d ".git" ]; then
              git fetch origin
              git reset --hard origin/master
            else
              git clone https://github.com/${{ github.repository }} .
            fi

            # 安装 Python 依赖
            cd server
            python3 -m venv .venv || true
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 配置环境变量
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "AUTH_DEV_TOTP_BYPASS=1" >> .env
            fi

            # 重启服务
            sudo systemctl restart fraudshield-backend || echo "服务未配置，稍后手动启动"
          EOF

      - name: Build Frontend
        run: |
          cd desktop
          npm ci
          npm run build

      - name: Deploy Frontend
        run: |
          # 上传前端构建产物
          scp -i ~/.ssh/id_rsa -r desktop/dist/* root@${{ secrets.SERVER_HOST }}:/opt/fraudshield2026/frontend/

          # 配置 Nginx
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
            # 创建前端目录
            mkdir -p /opt/fraudshield2026/frontend

            # 配置 Nginx（如果还没配置）
            if [ ! -f /etc/nginx/sites-available/fraudshield ]; then
              cat > /etc/nginx/sites-available/fraudshield << 'NGINX'
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /opt/fraudshield2026/frontend;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:8001;
    }
}
NGINX
              ln -sf /etc/nginx/sites-available/fraudshield /etc/nginx/sites-enabled/
              nginx -t && systemctl reload nginx
            fi
          EOF

      - name: Setup Systemd Service
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
            # 创建 systemd 服务文件
            cat > /etc/systemd/system/fraudshield-backend.service << 'SERVICE'
[Unit]
Description=FraudShield 2026 Backend API
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/opt/fraudshield2026/server
Environment="PATH=/opt/fraudshield2026/server/.venv/bin"
ExecStart=/opt/fraudshield2026/server/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 2
Restart=always
RestartSec=10

[Install]
WantedBy=multi-user.target
SERVICE

            # 启用并启动服务
            systemctl daemon-reload
            systemctl enable fraudshield-backend
            systemctl restart fraudshield-backend

            # 检查服务状态
            sleep 3
            systemctl status fraudshield-backend --no-pager || true
          EOF

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "=== 服务状态 ==="
            systemctl is-active fraudshield-backend || echo "后端服务未运行"

            echo ""
            echo "=== 端口监听 ==="
            netstat -tlnp | grep -E ':80|:8001' || echo "端口未监听"

            echo ""
            echo "=== 健康检查 ==="
            curl -s http://localhost:8001/health || echo "健康检查失败"
          EOF

      - name: Deployment Summary
        run: |
          echo "✅ 部署完成！"
          echo "🌐 访问地址: http://${{ secrets.SERVER_HOST }}"
          echo "📊 API 文档: http://${{ secrets.SERVER_HOST }}/docs"
